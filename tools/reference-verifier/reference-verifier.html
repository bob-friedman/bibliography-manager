<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Reference Verifier</title>
    <style>
        :root {
            --primary: #2980b9;
            --primary-hover: #1f6391;
            --bg: #f4f4f9;
            --card-bg: #ffffff;
            --text: #333;
            --border: #ccc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 20px; color: #2c3e50; text-align: center; font-size: 24px; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 4px; border: 1px solid var(--border); }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        textarea, select, input[type="text"], input[type="number"] {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px;
            font-size: 14px; font-family: monospace; margin-bottom: 15px; line-height: 1.4;
        }
        textarea { resize: vertical; min-height: 150px; }
        #logWindow { 
            min-height: 400px; 
            background-color: #fafafa; 
            padding: 10px;
            border: 1px solid var(--border);
            white-space: pre-wrap; 
            word-wrap: break-word; 
            overflow-y: auto; 
            font-family: monospace;
            font-size: 14px;
        }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; font-family: sans-serif;}
        .checkbox-row input { width: auto; margin: 0; }
        button {
            padding: 10px 15px; background-color: var(--primary); color: white; border: none;
            border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: var(--border); cursor: not-allowed; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Pro Reference Verifier</h1>
    <div class="container">
        <div class="card">
            <div class="checkbox-row">
                <input type="checkbox" id="set_strict" checked>
                <label for="set_strict" style="margin:0;">Strict Matching (Enables sequence scoring engine)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="set_debug" checked>
                <label for="set_debug" style="margin:0;">Verbose Diagnostic Logging (Shows score breakdowns for debugging)</label>
            </div>
            <div class="settings-grid">
                <div>
                    <label>Database</label>
                    <select id="set_database" onchange="toggleCustomUrl()">
                        <option value="crossref" selected>CrossRef (Best for standard citations)</option>
                        <option value="openalex">OpenAlex (Alternative search)</option>
                        <option value="custom">Custom Proxy URL</option>
                    </select>
                </div>
                <div id="custom_url_container" style="display: none;">
                    <label>Custom URL ({query} placeholder)</label>
                    <input type="text" id="set_custom_url" placeholder="https://proxy.com/?q={query}">
                </div>
                <div>
                    <label>Author Listing</label>
                    <select id="set_author_rule">
                        <option value="limit" selected>Truncate to et al.</option>
                        <option value="all">List all authors</option>
                    </select>
                </div>
                <div>
                    <label>Max Authors Before et al.</label>
                    <input type="number" id="set_author_max" value="3" min="1">
                </div>
            </div>
        </div>
        <div class="card">
            <label>Input References (Numbered or separated by blank lines)</label>
            <textarea id="rawReferences" placeholder="[1] Author, A. (2020). Title..."></textarea>
            <button id="btnVerify" onclick="startVerification()">Run Verification</button>
        </div>
        <div class="card">
            <div class="header-row">
                <label style="margin:0;">System Log & Output</label>
                <button onclick="copyLog()" style="padding: 5px 10px; font-size: 12px;">Copy Text</button>
            </div>
            <div id="logWindow">System ready.</div>
        </div>
    </div>
<script>
    function toggleCustomUrl() {
        var db = document.getElementById('set_database').value;
        document.getElementById('custom_url_container').style.display = (db === 'custom') ? 'block' : 'none';
    }
    function log(msg) {
        var logWindow = document.getElementById('logWindow');
        var linkedMsg = msg.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        logWindow.innerHTML += "\n" + linkedMsg;
        logWindow.scrollTop = logWindow.scrollHeight;
    }
    function clearLog() {
        document.getElementById('logWindow').innerText = "=== SYSTEM START: " + new Date().toLocaleTimeString() + " ===";
    }
    function copyLog() {
        var text = document.getElementById('logWindow').innerText;
        if (!text || text.trim() === "") {
            alert("Log is empty.");
            return;
        }
        navigator.clipboard.writeText(text).then(function() {
            alert("Log copied to clipboard.");
        });
    }
    function parseReferences(rawText) {
        var blocks = [];
        if (rawText.match(/^\s*\[?\d+\]?[\.\)]?\s/m)) {
            blocks = rawText.split(/(?:\n|\r\n|\r)(?=\s*\[?\d+\]?[\.\)]?\s)/);
            if (blocks.length === 1) {
                var inline = rawText.split(/\s+(?=\[\d+\])/);
                if (inline.length > 1) {
                    blocks = inline;
                } else {
                    inline = rawText.split(/\s+(?=\d+[\.\)]\s)/);
                    if (inline.length > 1) blocks = inline;
                }
            }
        } else if (rawText.indexOf('\n\n') !== -1) {
            blocks = rawText.split(/\n\n+/);
        } else {
            blocks = rawText.split('\n');
        }
        var cleanBlocks = [];
        for (var i = 0; i < blocks.length; i++) {
            var clean = blocks[i].replace(/\n/g, ' ').trim();
            if (clean.length > 5) {
                cleanBlocks.push(clean);
            }
        }
        return cleanBlocks;
    }
    function startVerification() {
        var rawText = document.getElementById('rawReferences').value.trim();
        if (!rawText) {
            alert("Please provide input references.");
            return;
        }
        var refs = parseReferences(rawText);
        clearLog();
        var btn = document.getElementById('btnVerify');
        btn.disabled = true;
        btn.innerText = "Processing...";
        log("Found " + refs.length + " reference(s) to process.");
        var finalRefs = [];
        var currentIndex = 0;
        function processNext() {
            if (currentIndex >= refs.length) {
                log("\n\n================ FINAL OUTPUT ================");
                log("\n" + finalRefs.join('\n\n'));
                log("\n==============================================");
                btn.disabled = false;
                btn.innerText = "Run Verification";
                return;
            }
            var originalRef = refs[currentIndex];
            var markerMatch = originalRef.match(/^(\s*\[?\d+\]?[\.\)]?\s*)/);
            var marker = markerMatch ? markerMatch[1] : "";
            var cleanQuery = originalRef.replace(/^(\s*\[?\d+\]?[\.\)]?\s*)/, "");
            log("\n--- Item " + (currentIndex + 1) + " ---");
            log("Original: " + originalRef);
            fetchMetadata(cleanQuery)
                .then(function(apiData) {
                    if (!apiData) {
                        log("Status: UNRESOLVED (No paper passed minimum score threshold)");
                        log("Diagnosis: NOT_IN_DATABASE (primary DB returned no record above threshold; no CORS fallback attempted per file:// constraint)");
                        log("Action: Please validate manually via web search (informational, no CORS fetch): https://duckduckgo.com/?q=" + encodeURIComponent(cleanQuery.slice(0, 120)));
                        finalRefs.push(originalRef); 
                    } else {
                        var isPerfect = checkPerfectMatch(originalRef, apiData);
                        if (isPerfect) {
                            log("Status: VERIFIED (Perfect match)");
                            finalRefs.push(originalRef);
                        } else {
                            var formatted = marker + formatReference(apiData, originalRef);
                            log("Status: CORRECTED");
                            log("Updated:  " + formatted);
                            finalRefs.push(formatted);
                        }
                    }
                    currentIndex++;
                    setTimeout(processNext, 750); 
                })
                .catch(function(error) {
                    log("Status: ERROR (" + error.message + ")");
                    finalRefs.push(originalRef);
                    currentIndex++;
                    setTimeout(processNext, 750);
                });
        }
        processNext();
    }
    function toWords(text) {
        var norm = (text || '');
        try { norm = norm.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch(e) {}
        var clean = norm.toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
        var raw = clean.split(/\s+/);
        var out = [];
        var stop = {and:1, for:1, the:1, with:1, from:1, are:1, was:1, has:1, had:1, this:1, that:1};
        for (var i = 0; i < raw.length; i++) {
            if (raw[i].length > 2 && !stop[raw[i]]) out.push(raw[i]);
        }
        return out;
    }
    function hasWord(wordList, word) {
        for (var i = 0; i < wordList.length; i++) {
            if (wordList[i] === word) return true;
        }
        return false;
    }
    function longestCommonRun(a, b) {
        if (a.length === 0 || b.length === 0) return 0;
        var prevRow = new Array(b.length + 1).fill(0);
        var best = 0;
        for (var i = 1; i <= a.length; i++) {
            var curRow = new Array(b.length + 1).fill(0);
            for (var j = 1; j <= b.length; j++) {
                if (a[i - 1] === b[j - 1]) {
                    curRow[j] = prevRow[j - 1] + 1;
                    if (curRow[j] > best) best = curRow[j];
                }
            }
            prevRow = curRow;
        }
        return best;
    }
    function extractTitleGuess(ref) {
        var titleChar = "(?:[^.]|\\.(?=\\d))";
        var m = ref.match(new RegExp("\\(\\s*(?:19|20)\\d{2}\\w?\\s*\\)\\.?\\s*(" + titleChar + "{10,300})\\."));
        if (m && m[1]) return m[1].trim();
        var m2 = ref.match(new RegExp("\\.?\\s*(" + titleChar + "{10,300})\\.\\s*(?:NeurIPS|NIPS|Advances|Journal|Conference|Proceedings|Transactions|arXiv)[^,]*,?\\s*(?:19|20)\\d{2}\\b","i"));
        if (m2 && m2[1]) {
            var cand = m2[1].trim().replace(/^.*\.\s*/,'').replace(/^[,;\s]+/,'');
            if (/^\d/.test(cand) || cand.length < 15) {
                var partsAlt = ref.split(/\.\s+(?![0-9])/);
                if (partsAlt.length >= 2) {
                    var maybeAlt = partsAlt[partsAlt.length-2].trim();
                    if (maybeAlt.length >= 10 && maybeAlt.length <= 300 && maybeAlt.toLowerCase().indexOf('deepseek') !== -1) return maybeAlt;
                }
            }
            if (cand.split(',').length > 4) {
                var parts = ref.split(/\.\s+(?![0-9])/);
                if (parts.length >= 2) {
                    var maybe = parts[parts.length-2].trim();
                    if (maybe.length >= 10 && maybe.length <= 300) return maybe;
                }
            }
            if (cand.length >= 10) return cand;
        }
        var m2b = ref.match(new RegExp("(?:^|\\.\\s+)(" + titleChar + "{10,300}?)\\s+(?:NeurIPS|NIPS|Advances|Journal|Conference|Proceedings|Transactions|arXiv)[^,]*,?\\s*(?:19|20)\\d{2}\\b","i"));
        if (m2b && m2b[1]) {
            var cand2 = m2b[1].trim();
            if (cand2.split(',').length <= 2 && cand2.length >= 10) return cand2;
        }
        var parts = ref.split(/\.\s+(?![0-9])/);
        if (parts.length >= 2) {
            var last = parts[parts.length-1];
            if (last.match(/(?:19|20)\d{2}/)) {
                var titleCand = parts[parts.length-2].trim();
                if (titleCand.length >= 10 && titleCand.length <= 300) return titleCand;
            }
        }
        return null;
    }
    function dedupeBy(items, keyFn) {
        var seen = {};
        var out = [];
        for (var i = 0; i < items.length; i++) {
            var k = keyFn(items[i]);
            if (!k || !seen[k]) {
                if (k) seen[k] = true;
                out.push(items[i]);
            }
        }
        return out;
    }
    function fetchArxivCandidates(titleGuess) {
        var isDebug = document.getElementById('set_debug').checked;
        if (!titleGuess) return Promise.resolve([]);
        if (isDebug) log("  [DEBUG] Fallback lookup SKIPPED (file:// – no CORS fetch; informational: https://duckduckgo.com/?q=" + encodeURIComponent(titleGuess.slice(0, 80)) + ")");
        return Promise.resolve([]);
    }
    function fetchMetadata(query) {
        var db = document.getElementById('set_database').value;
        var encodedQuery = encodeURIComponent(query);
        var isStrict = document.getElementById('set_strict').checked;
        var isDebug = document.getElementById('set_debug').checked;
        var titleGuess = extractTitleGuess(query);
        if (isDebug && titleGuess) log("  [DEBUG] Extracted title seed: \"" + titleGuess + "\"");
        if (db === 'crossref') {
            function safeJson(url){ return fetch(url).then(function(res){ return res.json(); }).catch(function(err){ if(isDebug) log("  [DEBUG] Query failed: " + err.message); return {message:{items:[]}}; }); }
            var fetches = [
                safeJson("https://api.crossref.org/works?query.bibliographic=" + encodedQuery +
                    "&rows=25&mailto=academic.verifier@example.com")
            ];
            if (titleGuess) {
                fetches.push(
                    safeJson("https://api.crossref.org/works?query.title=" + encodeURIComponent(titleGuess) +
                        "&rows=25&mailto=academic.verifier@example.com")
                );
                fetches.push(
                    safeJson("https://api.crossref.org/works?query.bibliographic=" + encodeURIComponent(titleGuess) +
                        "&rows=15&mailto=academic.verifier@example.com")
                );
            }
            return Promise.all(fetches).then(function(results) {
                var items = [];
                for (var i = 0; i < results.length; i++) {
                    var got = (results[i].message && results[i].message.items) ? results[i].message.items : [];
                    items = items.concat(got);
                }
                items = dedupeBy(items, function(item) { return item.DOI; });
                if (isDebug) log("  [DEBUG] Merged candidate pool: " + items.length + " unique record(s)");
                var bestCross = processScoring(items, mapCrossRefData, query, isStrict, isDebug);
                return fetchArxivCandidates(titleGuess).then(function(arxivItems){
                    if (arxivItems.length===0) return bestCross;
                    if (isDebug) log("  [DEBUG] arXiv fallback: " + arxivItems.length + " candidate(s)");
                    var bestArxiv=null; var bestArxivScore=50;
                    for (var ai=0; ai<arxivItems.length; ai++){
                        var av=scoreMatch(query, arxivItems[ai]);
                        if (isDebug){ var st=(arxivItems[ai].title||"").substring(0,45)+"... ("+arxivItems[ai].year+")"; log("    -> Score: "+av.score+" | "+st); log("       Breakdown: "+av.debugStr); }
                        if (av.score>bestArxivScore){ bestArxivScore=av.score; bestArxiv=arxivItems[ai]; }
                    }
                    if (!bestCross) return bestArxiv;
                    if (!bestArxiv) return bestCross;
                    var sCross=scoreMatch(query, bestCross).score;
                    if (bestArxivScore > sCross){ if(isDebug) log("  [DEBUG] arXiv outranks CrossRef ("+bestArxivScore+" vs "+sCross+")"); return bestArxiv; }
                    return bestCross;
                });
            });
        } 
        else if (db === 'openalex') {
            function safeJson2(url){ return fetch(url).then(function(res){ return res.json(); }).catch(function(err){ if(isDebug) log("  [DEBUG] Query failed: " + err.message); return {results:[]}; }); }
            var fetches2 = [
                safeJson2("https://api.openalex.org/works?search=" + encodedQuery + "&per-page=25")
            ];
            if (titleGuess) {
                fetches2.push(
                    safeJson2("https://api.openalex.org/works?filter=title.search:" + encodeURIComponent(titleGuess) + "&per-page=25")
                );
                fetches2.push(
                    safeJson2("https://api.openalex.org/works?search=" + encodeURIComponent(titleGuess) + "&per-page=15")
                );
            }
            return Promise.all(fetches2).then(function(results) {
                var items = [];
                for (var i = 0; i < results.length; i++) {
                    items = items.concat(results[i].results ? results[i].results : []);
                }
                items = dedupeBy(items, function(item) { return item.id; });
                if (isDebug) log("  [DEBUG] Merged candidate pool: " + items.length + " unique record(s)");
                var bestOA = processScoring(items, mapOpenAlexData, query, isStrict, isDebug);
                return fetchArxivCandidates(titleGuess).then(function(arxivItems){
                    if (arxivItems.length===0) return bestOA;
                    if (isDebug) log("  [DEBUG] arXiv fallback: " + arxivItems.length + " candidate(s)");
                    var bestArxiv=null; var bestArxivScore=50;
                    for (var ai=0; ai<arxivItems.length; ai++){
                        var av=scoreMatch(query, arxivItems[ai]);
                        if (isDebug){ var st=(arxivItems[ai].title||"").substring(0,45)+"... ("+arxivItems[ai].year+")"; log("    -> Score: "+av.score+" | "+st); log("       Breakdown: "+av.debugStr); }
                        if (av.score>bestArxivScore){ bestArxivScore=av.score; bestArxiv=arxivItems[ai]; }
                    }
                    if (!bestOA) return bestArxiv;
                    if (!bestArxiv) return bestOA;
                    var sOA=bestOA? scoreMatch(query, bestOA).score : -1;
                    if (bestArxivScore > sOA){ if(isDebug) log("  [DEBUG] arXiv outranks OpenAlex ("+bestArxivScore+" vs "+sOA+")"); return bestArxiv; }
                    return bestOA;
                });
            });
        }
        else if (db === 'custom') {
            var customUrl = document.getElementById('set_custom_url').value;
            if (customUrl.indexOf('{query}') === -1) return Promise.reject(new Error("Custom URL missing {query}"));
            return fetch(customUrl.replace('{query}', encodedQuery)).then(function(res) { return res.json(); });
        }
    }
    function processScoring(items, mapper, query, isStrict, isDebug) {
        if (!items || items.length === 0) return null;
        var bestData = null;
        var bestScore = 50;
        if (isDebug && isStrict) log("  [DEBUG] API returned " + items.length + " candidates. Scoring top candidates:");
        for (var k = 0; k < items.length; k++) {
            var apiData = mapper(items[k]);
            if (!isStrict) return apiData; 
            var evalResult = scoreMatch(query, apiData);
            if (isDebug) {
                var shortTitle = (apiData.title || "No Title").substring(0, 45).replace(/\n/g, '') + "...";
                log("    -> Score: " + evalResult.score + " | " + shortTitle + " (" + apiData.year + ")");
                log("       Breakdown: " + evalResult.debugStr);
            }
            if (evalResult.score > bestScore) {
                bestScore = evalResult.score;
                bestData = apiData;
            }
        }
        return bestData; 
    }
    function scoreMatch(inputRef, apiData) {
        var score = 0;
        var breakdown = [];
        var rawInputLower = inputRef.toLowerCase();
        var cInput = rawInputLower.replace(/[^a-z0-9\s]/g, '');
        var inputWords = toWords(inputRef);
        var apiTitle = apiData.title || '';
        var titleWords = toWords(apiTitle);
        if (titleWords.length > 0) {
            var runLen = longestCommonRun(titleWords, inputWords);
            var runRatio = runLen / titleWords.length;
            var scatterCount = 0;
            for (var j = 0; j < titleWords.length; j++) {
                if (hasWord(inputWords, titleWords[j])) scatterCount++;
            }
            var scatterRatio = scatterCount / titleWords.length;
            if (titleWords.length <= 4) {
                if (runRatio < 1.0 && scatterRatio < 1.0) {
                    return { score: -999, debugStr: "VETO (short-title strict: run=" + runLen + "/" + titleWords.length + ", scatter=" + Math.round(scatterRatio*100) + "%)" };
                }
            } else if (runRatio < 0.6 && scatterRatio < 0.85) {
                return { score: -999, debugStr: "VETO (no strong phrase match: run=" + runLen + "/" + titleWords.length + ", scatter=" + Math.round(scatterRatio*100) + "%)" };
            }
            var titlePts = Math.round(runRatio * 50 + scatterRatio * 10);
            score += titlePts;
            breakdown.push("Title:+" + titlePts + " (run " + runLen + "/" + titleWords.length + ")");
            var inputTitleGuess = extractTitleGuess(inputRef);
            if (inputTitleGuess) {
                var inputTitleWords = toWords(inputTitleGuess);
                if (inputTitleWords.length > titleWords.length + 2 && runLen === titleWords.length) {
                    var extra = inputTitleWords.length - titleWords.length;
                    if (extra >= 3) {
                        return { score: -999, debugStr: "VETO (copycat: input title longer by " + extra + " words, api subset)" };
                    }
                }
            }
        } else {
            breakdown.push("Title:0");
        }
        if (apiData.authors && apiData.authors.length > 0) {
            var isEtAlInput = rawInputLower.indexOf('et al') !== -1;
            var checkCount = isEtAlInput ? 1 : Math.min(3, apiData.authors.length);
            var authorHits = 0, authorChecked = 0;
            for (var a = 0; a < checkCount; a++) {
                var fam = apiData.authors[a] && apiData.authors[a].family;
                if (!fam) continue;
                var cAuthor = fam.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (cAuthor.length === 0) continue;
                authorChecked++;
                if (hasWord(inputWords, cAuthor)) authorHits++;
            }
            if (authorChecked > 0) {
                if (authorHits > 0) {
                    var authPts = Math.round((authorHits / authorChecked) * 25);
                    score += authPts;
                    breakdown.push("Auth:+" + authPts + " (" + authorHits + "/" + authorChecked + ")");
                } else {
                    var hasAuthorPattern = inputRef.match(/[A-Z][a-z]+,\s*[A-Z]\./) || rawInputLower.indexOf('et al') !== -1;
                    if (hasAuthorPattern) {
                        return { score: -999, debugStr: "VETO (author mismatch: none of " + authorChecked + " matched, input has author)" };
                    } else {
                        breakdown.push("Auth:0 (no author in input)");
                    }
                }
            }
        }
        var apiYear = apiData.year + "";
        var yearMatch = inputRef.match(/\b(19|20)\d{2}\b/);
        if (yearMatch) {
            var inputYear = parseInt(yearMatch[0], 10);
            var dataYear = parseInt(apiYear, 10);
            if (!isNaN(dataYear)) {
                var diff = Math.abs(inputYear - dataYear);
                if (diff === 0) { score += 30; breakdown.push("Year:+30"); }
                else if (diff === 1) { score += 15; breakdown.push("Year:+15"); }
                else if (diff === 2) { score -= 10; breakdown.push("Year:-10"); }
                else if (diff <= 4) { score -= 20; breakdown.push("Year:-20"); }
                else {
                    score -= 25; breakdown.push("Year:-25 (diff " + diff + ")");
                }
            }
        }
        var apiJournal = apiData.journal || '';
        var journalWords = toWords(apiJournal);
        var isNeurIPSInput = rawInputLower.indexOf('neurips') !== -1 || rawInputLower.indexOf('nips') !== -1;
        var isNeurIPSAapi = apiJournal.toLowerCase().indexOf('neurips') !== -1 || apiJournal.toLowerCase().indexOf('neural information processing') !== -1 || apiJournal.toLowerCase().indexOf('nips') !== -1;
        if (isNeurIPSInput && isNeurIPSAapi) {
            score += 18; breakdown.push("Venue:+18 (NeurIPS alias)");
        } else if (journalWords.length > 0) {
            var jMatchCount = 0;
            for (var n = 0; n < journalWords.length; n++) {
                if (hasWord(inputWords, journalWords[n])) jMatchCount++;
            }
            if (jMatchCount > 0) {
                var venuePts = Math.round((jMatchCount / journalWords.length) * 18);
                score += venuePts;
                breakdown.push("Venue:+" + venuePts);
            } else {
                var inputHasVenue = rawInputLower.indexOf('neurips') !== -1 || rawInputLower.indexOf('journal') !== -1 || rawInputLower.indexOf('conference') !== -1 || rawInputLower.indexOf('proceedings') !== -1 || rawInputLower.indexOf('transactions') !== -1;
                if (inputHasVenue && apiJournal.length > 3) {
                    score -= 3; breakdown.push("Venue:-3 (mismatch)");
                }
            }
        }
        var isApiPreprint = (apiJournal.toLowerCase().indexOf('arxiv') !== -1 || 
                             apiJournal.toLowerCase().indexOf('preprint') !== -1 ||
                             apiJournal.toLowerCase().indexOf('rxiv') !== -1);
        var isInputPreprint = (rawInputLower.indexOf('arxiv') !== -1 || 
                               rawInputLower.indexOf('preprint') !== -1 ||
                               rawInputLower.indexOf('rxiv') !== -1);
        if (isApiPreprint && !isInputPreprint) {
            score -= 15; 
            breakdown.push("PreprintPen:-15");
        }
        var cites = apiData.citations || 0;
        var citePts = 0;
        if (cites > 5000) citePts = 30;
        else if (cites > 500) citePts = 20;
        else if (cites > 50) citePts = 10;
        if (citePts > 0) {
            score += citePts;
            breakdown.push("Cites:+" + citePts + " (" + cites + " ref)");
        }
        var doiStr = (apiData._doi || '').toLowerCase();
        if (doiStr.indexOf('10.65215') !== -1 || apiJournal.toLowerCase().indexOf('shenzhen') !== -1) {
            score -= 8; breakdown.push("SpamDOI:-8");
        }
        if (yearMatch) {
            var inputYear2 = parseInt(yearMatch[0],10);
            var dataYear2 = parseInt(apiData.year,10);
            if (!isNaN(dataYear2) && dataYear2 > inputYear2 + 5 && cites < 100) {
                score -= 5; breakdown.push("FutureSpam:-5");
            }
        }
        return { score: score, debugStr: breakdown.join(", ") };
    }
    function mapCrossRefData(item) {
        var title = (item.title && item.title.length > 0) ? item.title[0] : '';
        var authors = item.author || [];
        var year = 'n.d.';
        if (item.issued && item.issued['date-parts'] && item.issued['date-parts'][0] && item.issued['date-parts'][0][0]) {
            year = item.issued['date-parts'][0][0];
        } else if (item.published && item.published['date-parts'] && item.published['date-parts'][0] && item.published['date-parts'][0][0]) {
            year = item.published['date-parts'][0][0];
        }
        var journal = (item['container-title'] && item['container-title'].length > 0) ? item['container-title'][0] : (item.publisher || '');
        return {
            title: title,
            authors: authors,
            year: year,
            journal: journal,
            volume: item.volume || '',
            issue: item.issue || '',
            pages: item.page || '',
            citations: item['is-referenced-by-count'] || 0,
            _doi: item.DOI || '',
            _rawJournal: journal
        };
    }
    function mapOpenAlexData(item) {
        var rawAuthors = item.authorships || [];
        var authors = [];
        for (var i = 0; i < rawAuthors.length; i++) {
            var a = rawAuthors[i];
            if (a.author && a.author.display_name) {
                var names = a.author.display_name.split(' ');
                var family = names.pop();
                var given = names.join(' ');
                authors.push({ family: family, given: given });
            }
        }
        var journal = '';
        if (item.primary_location && item.primary_location.source && item.primary_location.source.display_name) {
            journal = item.primary_location.source.display_name;
        }
        var volume = '', issue = '', pages = '';
        if (item.biblio) {
            volume = item.biblio.volume || '';
            issue = item.biblio.issue || '';
            if (item.biblio.first_page) {
                pages = item.biblio.first_page + (item.biblio.last_page ? '-' + item.biblio.last_page : '');
            }
        }
        return {
            title: item.title || '',
            authors: authors,
            year: item.publication_year || 'n.d.',
            journal: journal,
            volume: volume,
            issue: issue,
            pages: pages,
            citations: item.cited_by_count || 0,
            _doi: item.doi || item.id || '',
            _rawJournal: journal
        };
    }
    function formatReference(data, originalRef) {
        var rule = document.getElementById('set_author_rule').value;
        var maxLimit = parseInt(document.getElementById('set_author_max').value, 10) || 3;
        var forceEtAl = originalRef.toLowerCase().indexOf('et al') !== -1;
        var useLimit = (rule === 'limit') || forceEtAl;
        function formatOne(a) {
            return a.given ? (a.family + ", " + a.given[0] + '.') : a.family;
        }
        var authorStr = "Unknown";
        if (data.authors && data.authors.length > 0) {
            if (useLimit && data.authors.length > maxLimit) {
                var top = data.authors.slice(0, maxLimit);
                var formattedTop = [];
                for (var i = 0; i < top.length; i++) {
                    formattedTop.push(formatOne(top[i]));
                }
                authorStr = formattedTop.join(', ') + ', et al.';
            } else {
                var formattedAll = [];
                for (var j = 0; j < data.authors.length; j++) {
                    formattedAll.push(formatOne(data.authors[j]));
                }
                authorStr = formattedAll.join(', ');
            }
        }
        var ref = authorStr + " (" + data.year + "). " + data.title + ".";
        if (data.journal) ref += " " + data.journal;
        if (data.volume) ref += ", " + data.volume;
        if (data.issue) ref += "(" + data.issue + ")";
        if (data.pages) ref += ", " + data.pages;
        var cleaned = ref.replace(/\s+/g, ' ').replace(/\s([.,])/g, '$1').trim();
        return /[.!?]$/.test(cleaned) ? cleaned : cleaned + '.';
    }
    function checkPerfectMatch(original, apiData) {
        var inputWords = toWords(original);
        var titleWords = toWords(apiData.title || '');
        if (titleWords.length === 0) return false;
        var run = longestCommonRun(titleWords, inputWords);
        if (run !== titleWords.length) return false;
        var yM = original.match(/\b(19|20)\d{2}\b/);
        if (!yM || yM[0] !== String(apiData.year)) return false;
        if (apiData.authors && apiData.authors[0] && apiData.authors[0].family) {
            var fam = apiData.authors[0].family.toLowerCase().replace(/[^a-z0-9]/g,'');
            if (fam.length>2 && !hasWord(inputWords, fam)) return false;
        }
        var origLow = original.toLowerCase();
        var jourLow = (apiData.journal||"").toLowerCase();
        var isNeurIPS = jourLow.indexOf('neurips')!==-1 || jourLow.indexOf('neural information processing')!==-1 || jourLow.indexOf('nips')!==-1;
        if (isNeurIPS) {
            if (!(origLow.indexOf('neurips')!==-1 || origLow.indexOf('nips')!==-1 || origLow.indexOf('neural information processing')!==-1)) return false;
        }
        return true;
    }
